services:
  db:
    image: postgres
    environment:
      POSTGRES_USER: notesuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: notesdb
    volumes:
      - notes-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notesuser -d notesdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DB_HOST: db
      DB_NAME: notesdb
      DB_USER: notesuser
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"

volumes:
  notes-data:
